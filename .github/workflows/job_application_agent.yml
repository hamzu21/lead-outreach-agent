name: Job Application Agent (Disabled)

on:
  # schedule:
  #   # Runs 4 times a day (every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC)
  #   - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batch limit for job applications'
        required: false
        default: '1'

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Token Files
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          HAS_ERRORS=0
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "::error title=Missing GitHub Secret::GOOGLE_CREDENTIALS_JSON secret is missing or empty in GitHub Settings!"
            HAS_ERRORS=1
          else
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
            echo "Created credentials.json"
          fi

          if [ -z "$GOOGLE_TOKEN_JSON" ]; then
            echo "::error title=Missing GitHub Secret::GOOGLE_TOKEN_JSON secret is missing or empty in GitHub Settings!"
            HAS_ERRORS=1
          else
            echo "$GOOGLE_TOKEN_JSON" > token.json
            echo "Created token.json"
          fi

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing GitHub Secret::GEMINI_API_KEY secret is missing or empty in GitHub Settings!"
            HAS_ERRORS=1
          fi

          if [ $HAS_ERRORS -eq 1 ]; then
            echo "Please set GEMINI_API_KEY, GOOGLE_CREDENTIALS_JSON, and GOOGLE_TOKEN_JSON under Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Execute Job Application Agent (4 Times Daily)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID || '1OFy4ZgsUJsY0vwzdbHv-Lq6a6A1fagjb_8dbhX1y5pQ' }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          python main.py --mode jobs --limit "$LIMIT"

      - name: Upload Generated Candidate Resume PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Muhammad_Hamza_CV
          path: Muhammad_Hamza_CV.pdf
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Local Excel Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-outreach-log
          path: lead_outreach_log.xlsx
          if-no-files-found: ignore
          retention-days: 14
