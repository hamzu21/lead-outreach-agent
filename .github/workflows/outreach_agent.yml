name: Lead Outreach Agent Automated Workflow

on:
  schedule:
    # Runs daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batch limit for email drafting'
        required: false
        default: '10'

jobs:
  run-outreach-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Credentials & Token Files
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
            echo "Created credentials.json"
          fi
          if [ -n "$GOOGLE_TOKEN_JSON" ]; then
            echo "$GOOGLE_TOKEN_JSON" > token.json
            echo "Created token.json"
          fi

      - name: Execute Lead Outreach Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          python main.py --limit "$LIMIT"

      - name: Upload Local Excel Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-outreach-log
          path: lead_outreach_log.xlsx
          if-no-files-found: ignore
          retention-days: 30
